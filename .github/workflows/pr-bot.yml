name: "PR Monitor & Preview Bot"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-preview-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-bot:
    name: "PR Monitor, Checks & Preview Guide"
    runs-on: macos-14
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Detect Changed Files & Components"
        id: detect-changes
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          # Fallback if base sha is not directly available
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="HEAD~1"
          fi
          
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          WEB_CHANGED=false
          DESKTOP_CHANGED=false
          RUST_CHANGED=false
          SCRIPTS_CHANGED=false
          DOCS_CHANGED=false
          
          if echo "$CHANGED_FILES" | grep -q "^apps/web/"; then
            WEB_CHANGED=true
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/desktop/"; then
            DESKTOP_CHANGED=true
          fi
          if echo "$CHANGED_FILES" | grep -q "^apps/desktop/src-tauri/"; then
            RUST_CHANGED=true
          fi
          if echo "$CHANGED_FILES" | grep -q "^scripts/\|Cargo\.toml\|package\.json"; then
            SCRIPTS_CHANGED=true
          fi
          if echo "$CHANGED_FILES" | grep -q "\.md$"; then
            DOCS_CHANGED=true
          fi
          
          echo "web_changed=$WEB_CHANGED" >> $GITHUB_OUTPUT
          echo "desktop_changed=$DESKTOP_CHANGED" >> $GITHUB_OUTPUT
          echo "rust_changed=$RUST_CHANGED" >> $GITHUB_OUTPUT
          echo "scripts_changed=$SCRIPTS_CHANGED" >> $GITHUB_OUTPUT
          echo "docs_changed=$DOCS_CHANGED" >> $GITHUB_OUTPUT
          
          # Count lines of code changed
          STATS=$(git diff --shortstat "$BASE_SHA" "$HEAD_SHA" || echo "0 files changed, 0 insertions(+), 0 deletions(-)")
          echo "diff_stats=$STATS" >> $GITHUB_OUTPUT

      - name: "Setup Node.js & pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: '**/package.json'

      - name: "Verify Web App (Next.js)"
        id: verify-web
        if: steps.detect-changes.outputs.web_changed == 'true'
        shell: bash
        run: |
          echo "Running build validation for apps/web..."
          cd apps/web
          pnpm install --no-frozen-lockfile
          pnpm run build || npx next build
          echo "web_status=success" >> $GITHUB_OUTPUT

      - name: "Verify Desktop Frontend (Vite + TypeScript)"
        id: verify-desktop
        if: steps.detect-changes.outputs.desktop_changed == 'true'
        shell: bash
        run: |
          echo "Running build validation for apps/desktop frontend..."
          cd apps/desktop
          pnpm install --no-frozen-lockfile
          pnpm run build || npx vite build
          echo "desktop_status=success" >> $GITHUB_OUTPUT

      - name: "Setup Rust Toolchain"
        if: steps.detect-changes.outputs.rust_changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: "Verify Rust / Tauri Backend"
        id: verify-rust
        if: steps.detect-changes.outputs.rust_changed == 'true'
        shell: bash
        run: |
          echo "Running cargo check for apps/desktop/src-tauri..."
          cd apps/desktop/src-tauri
          cargo check --lib
          echo "rust_status=success" >> $GITHUB_OUTPUT

      - name: "Sticky PR Preview Bot Comment & Triage"
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.warning("No pull request payload found. Skipping comment.");
              return;
            }

            const prNumber = pr.number;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const headSha = pr.head.sha.substring(0, 7);
            const branchName = pr.head.ref;
            const baseBranch = pr.base.ref;
            const author = pr.user.login;

            // Gather check statuses
            const webChanged = "${{ steps.detect-changes.outputs.web_changed }}" === "true";
            const desktopChanged = "${{ steps.detect-changes.outputs.desktop_changed }}" === "true";
            const rustChanged = "${{ steps.detect-changes.outputs.rust_changed }}" === "true";
            const scriptsChanged = "${{ steps.detect-changes.outputs.scripts_changed }}" === "true";
            const docsChanged = "${{ steps.detect-changes.outputs.docs_changed }}" === "true";
            const diffStats = "${{ steps.detect-changes.outputs.diff_stats }}" || "N/A";

            const webStepStatus = "${{ steps.verify-web.outcome }}";
            const desktopStepStatus = "${{ steps.verify-desktop.outcome }}";
            const rustStepStatus = "${{ steps.verify-rust.outcome }}";

            const formatStatus = (changed, stepOutcome) => {
              if (!changed) return " _Not modified (Skipped)_";
              if (stepOutcome === "success") return " **Passing**";
              if (stepOutcome === "failure") return " **Failed**";
              if (stepOutcome === "cancelled") return " **Cancelled**";
              return " **In progress / Unknown**";
            };

            const webStatusText = formatStatus(webChanged, webStepStatus);
            const desktopStatusText = formatStatus(desktopChanged, desktopStepStatus);
            const rustStatusText = formatStatus(rustChanged, rustStepStatus);

            // Determine size category based on diff
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const totalChanges = additions + deletions;
            let sizeLabel = "size: XS";
            let sizeEmoji = "";
            if (totalChanges > 1000) { sizeLabel = "size: XL"; sizeEmoji = ""; }
            else if (totalChanges > 500) { sizeLabel = "size: L"; sizeEmoji = ""; }
            else if (totalChanges > 200) { sizeLabel = "size: M"; sizeEmoji = "️"; }
            else if (totalChanges > 50) { sizeLabel = "size: S"; sizeEmoji = ""; }

            // Apply Labels Automatically
            const labelsToAdd = [sizeLabel];
            if (webChanged) labelsToAdd.push("area: web");
            if (desktopChanged) labelsToAdd.push("area: desktop");
            if (rustChanged) labelsToAdd.push("area: rust-backend");
            if (docsChanged && !webChanged && !desktopChanged && !rustChanged) labelsToAdd.push("area: documentation");
            if (scriptsChanged) labelsToAdd.push("area: infra/config");

            try {
              await github.rest.issues.addLabels({
                owner: repoOwner,
                repo: repoName,
                issue_number: prNumber,
                labels: labelsToAdd
              });
            } catch (err) {
              core.info("Notice: Could not automatically set labels (requires repo permissions): " + err.message);
            }

            // Build sticky comment
            const botMarker = "<!-- PR_PREVIEW_BOT_COMMENT -->";
            const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19) + " UTC";

            const commentBody = [
              botMarker,
              `##  LiveSpeak PR Preview & Health Monitor`,
              ``,
              `> Monitored commit [\`${headSha}\`](${pr.html_url}/commits/${pr.head.sha}) on branch \`${branchName}\` (targeting \`${baseBranch}\`) by @${author}.`,
              `> **Last Updated:** ${timestamp}`,
              ``,
              `###  Verification & Build Matrix`,
              `| Target Component | Impacted? | Status | Details |`,
              `| :--- | :---: | :---: | :--- |`,
              `|  **Web App** (\`apps/web\`) | ${webChanged ? " Yes" : "—"} | ${webStatusText} | Next.js 14 / SSR |`,
              `| ️ **Desktop UI** (\`apps/desktop\`) | ${desktopChanged ? " Yes" : "—"} | ${desktopStatusText} | React + Vite + Tailwind |`,
              `| ️ **Rust Core & Tauri** (\`src-tauri\`) | ${rustChanged ? " Yes" : "—"} | ${rustStatusText} | Audio, VAD & Tungstenite Engine |`,
              `|  **Config & Scripts** | ${scriptsChanged ? " Yes" : "—"} | ${scriptsChanged ? "️ Review needed" : "Clean"} | Build sidecars & models |`,
              ``,
              `**Diff Metrics:** ${sizeEmoji} \`${diffStats}\` (Categorized as \`${sizeLabel}\`)`,
              ``,
              `---`,
              ``,
              `###  Preview & Local Testing Guide`,
              `To test and preview these changes locally, run the following in your terminal:`,
              ``,
              `\`\`\`bash`,
              `# 1. Fetch & checkout this PR branch`,
              `gh pr checkout ${prNumber}`,
              `# or: git fetch origin pull/${prNumber}/head:pr-${prNumber} && git checkout pr-${prNumber}`,
              ``,
              ...(webChanged ? [
                `# 2. Preview Web Application (Next.js)`,
                `cd apps/web && pnpm install && pnpm dev`,
                `# Open http://localhost:3000 to preview the web client`,
                ``
              ] : []),
              ...(desktopChanged || rustChanged ? [
                `# 3. Preview Desktop Application (Vite / Tauri)`,
                `cd apps/desktop && pnpm install && pnpm dev`,
                `# Or run full native Tauri app:`,
                `pnpm tauri dev`,
                ``
              ] : []),
              `\`\`\``,
              ``,
              `---`,
              ``,
              `###  Reviewer Quality Checklist`,
              `- [ ] **Visual Preview**: Verified UI layout, animations, and color scheme.`,
              `- [ ] **Audio Capture**: Tested mic buffer & process loopback routing (if applicable).`,
              `- [ ] **WebSocket Broadcast**: Tested \`/broadcast\` transparent view & QR code generation.`,
              `- [ ] **No regressions**: Checked console logs and terminal output for warnings.`
            ].join('\n');

            // Find existing sticky comment to update instead of creating duplicate comments
            const commentsResponse = await github.rest.issues.listComments({
              owner: repoOwner,
              repo: repoName,
              issue_number: prNumber,
            });

            const existingComment = commentsResponse.data.find(c => c.body && c.body.includes(botMarker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: repoOwner,
                repo: repoName,
                comment_id: existingComment.id,
                body: commentBody
              });
              core.info(`Successfully updated PR preview comment ID: ${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: prNumber,
                body: commentBody
              });
              core.info(`Created new PR preview comment on PR #${prNumber}`);
            }
