[package]
name = "livespeak"
version = "0.1.0"
description = "LiveSpeak macOS Native STT & Live Event Engine"
authors = ["LiveSpeak Team"]
license = "MIT"
edition = "2021"

[lib]
name = "livespeak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0" }
tauri-plugin-shell = "2.0.0"
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-clipboard-manager = "2.0.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"

cpal = "0.15"
hound = "3.5"
local-ip-address = "0.6"
qrcode = "0.14"
base64 = "0.22"
regex = "1.10"
byteorder = "1.5"
lazy_static = "1.5"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
