<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="softGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="waveGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#000000" stop-opacity="1" />
      <stop offset="100%" stop-color="#2a2b30" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- App Icon Background: Clean Pure Ceramic White Squircle -->
  <rect width="512" height="512" rx="116" fill="#fcfcfe"/>
  
  <!-- Subtle border for contrast against light backdrops -->
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Center Wavy Sound Wave Flow Symbol (Dark ink on light canvas) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wave 1: Gentle top crest / secondary overtone -->
    <path d="M 120 286 C 160 286, 185 200, 225 200 C 265 200, 280 300, 320 300 C 355 300, 375 250, 400 250" 
          stroke="#000000" stroke-opacity="0.2" stroke-width="7" />

    <!-- Wave 2: Rising harmonizing resonance -->
    <path d="M 105 272 C 145 272, 175 168, 220 168 C 265 168, 280 324, 325 324 C 365 324, 385 240, 412 240" 
          stroke="#000000" stroke-opacity="0.45" stroke-width="11" />

    <!-- Wave 3: Main Core Resonant Wave (Primary Voice Stream) -->
    <path d="M 92 256 C 140 256, 170 128, 218 128 C 270 128, 280 376, 332 376 C 375 376, 395 256, 424 256" 
          stroke="url(#waveGradLight)" stroke-width="18" filter="url(#softGlowLight)" />

    <!-- Wave 4: Deep stabilizing frequency bar -->
    <path d="M 105 240 C 145 240, 175 340, 220 340 C 265 340, 280 188, 325 188 C 365 188, 385 272, 412 272" 
          stroke="#000000" stroke-opacity="0.45" stroke-width="11" />

    <!-- Wave 5: Lower trailing echo -->
    <path d="M 120 226 C 160 226, 185 312, 225 312 C 265 312, 280 212, 320 212 C 355 212, 375 262, 400 262" 
          stroke="#000000" stroke-opacity="0.2" stroke-width="7" />
  </g>

  <!-- Accent dots -->
  <circle cx="82" cy="256" r="4.5" fill="#000000" fill-opacity="0.35" />
  <circle cx="436" cy="256" r="4.5" fill="#000000" fill-opacity="0.35" />
</svg>
